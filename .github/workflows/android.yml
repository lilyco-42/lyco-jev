# Android CI for lyco-jev.
#
# Structure copied from android/nowinandroid's Build.yaml (checkout -> setup-java ->
# setup-gradle -> upload-artifact), trimmed to what this project actually needs,
# plus two things the reference does not have to deal with:
#
#   1. an NDK/CMake native build: app/src/main/cpp compiles llama.cpp, which is
#      pulled at a pinned commit by CMake FetchContent, and
#      app/build.gradle.kts pins ndkVersion 30.0.15729638 / CMake 3.22.1;
#   2. model assets that are NOT committed (23 MB encoder + 20 MB detector + two
#      0.53 GB GGUF weights - a judge and a drafting model), so they are fetched
#      here - and skipped when someone does commit them.
#
# Both GGUFs are bundled, so a distribution debug APK is ~1.1 GiB and an install
# is offline immediately. They are fetched from the lain42 OSS mirror rather than
# HuggingFace (slow or unreachable from mainland China) and checked against a
# pinned hash. Note the CI debug build keeps BOTH ABIs because the instrumented
# tests run on an x86_64 emulator; only the publish step below rebuilds arm64-only.
name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    # The llama.cpp build is the long pole; it is built for two ABIs in debug.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The catalog updater sits on the release path, but the publish step that
      # calls it only runs on a manual dispatch with OSS secrets set - so without
      # this, a plain push would never execute a line of it. Offline and instant.
      - name: Verify the download-catalog updater
        run: python3 tools/update-manifest.py --self-test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No android-actions/setup-android here: on ubuntu-latest it runs the
      # runner's own sdkmanager and has been failing with exit 1 while accepting
      # licences (its bundled action is stale against the runner's cmdline-tools,
      # and 'yes | sdkmanager --licenses' trips pipefail when sdkmanager exits).
      # The SDK is preinstalled; drive it directly.
      - name: Install platform, NDK and CMake
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

          # sdkmanager is usually on PATH; fall back to whichever cmdline-tools
          # revision the image shipped.
          if ! command -v sdkmanager > /dev/null; then
            for d in "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin "$ANDROID_HOME"/cmdline-tools/*/bin; do
              [ -x "$d/sdkmanager" ] && export PATH="$PATH:$d" && break
            done
          fi
          sdkmanager --version

          # 'yes' gets SIGPIPE when sdkmanager finishes, so this pipeline is
          # expected to be non-zero even on success.
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;30.0.15729638" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.15729638" >> "$GITHUB_ENV"

      - name: Fetch model assets
        run: |
          set -euo pipefail
          BGE=app/src/main/assets/models/bge-small-zh
          YOLO=app/src/main/assets/models/yolo
          mkdir -p "$BGE" "$YOLO"

          if [ ! -f "$BGE/model_quantized.onnx" ]; then
            base=https://huggingface.co/Xenova/bge-small-zh-v1.5/resolve/main
            curl -sSL --fail --retry 5 -o "$BGE/model_quantized.onnx" "$base/onnx/model_quantized.onnx"
            curl -sSL --fail --retry 5 -o "$BGE/vocab.txt"             "$base/vocab.txt"
            curl -sSL --fail --retry 5 -o "$BGE/tokenizer_config.json" "$base/tokenizer_config.json"
          fi

          if [ ! -f "$YOLO/detector.onnx" ]; then
            # Apache-2.0 YOLOX tiny - NOT Ultralytics YOLOv8/v11, whose weights are
            # AGPL-3.0 and would relicense this MIT app.
            curl -sSL --fail --retry 5 -o "$YOLO/detector.onnx" \
              https://huggingface.co/cj-mills/yolox-coco-baseline-onnx/resolve/main/coco-yolox_tiny.onnx
          fi

          # The two GGUF weights are fetched ONLY for a distribution build
          # (workflow_dispatch). On a plain push they would add 1 GB of download,
          # pack a 1.1 GB APK and upload it as an artifact - for an APK nobody
          # downloads from CI, and over the artifact quota. Every test that needs a
          # weight stages it locally instead (see the LocalJudge / LocalReply
          # instrumented tests, which are deliberately not in this gate).
          #
          # Fetched from the lain42 OSS mirror rather than HuggingFace (slow or
          # unreachable from mainland China), and verified against the published
          # hash: a truncated or swapped weight would otherwise ship inside the APK
          # and only fail on someone's phone.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GGUF=app/src/main/assets/models/jev-style/Jev-Style-0.8B-Decision-v3-Q4_K_M.gguf
            if [ ! -f "$GGUF" ]; then
              mkdir -p "$(dirname "$GGUF")"
              curl -sSL --fail --retry 5 -o "$GGUF" \
                https://dl.lain42.top/models/hf/chaoliangUNSW/Jev-Style-0.8B-Decision-v3-GGUF/resolve/edf37c26a1098f83cf4264b8adbe0dca2d2ebb0c/Jev-Style-0.8B-Decision-v3-Q4_K_M.gguf
            fi
            echo "0a19bc29bacc33e0d871146c8612b24dd14c2ed2e61cedeb7a928b0852628bac  $GGUF" | sha256sum -c -

            # The drafting weight. Jev-Style answers only yes/no, so candidate
            # replies need a generative model; Qwen3.5-0.8B is the base Jev-Style
            # was fine-tuned from. Not in the lain42 mirror yet, so it comes from
            # HuggingFace.
            REPLY=app/src/main/assets/models/reply/Qwen3.5-0.8B-Q4_K_M.gguf
            if [ ! -f "$REPLY" ]; then
              mkdir -p "$(dirname "$REPLY")"
              curl -sSL --fail --retry 5 -o "$REPLY" \
                https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf
            fi
            echo "bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517  $REPLY" | sha256sum -c -
          else
            echo "push build: skipping the GGUF weights (distribution-only)"
          fi

          if [ ! -f "$YOLO/coco_labels.txt" ]; then
          # A heredoc, not 'printf %s\n a b c': multi-word labels such as
          # "traffic light" and "potted plant" would be split into separate
          # arguments, silently shifting every class index by one or more.
          cat > "$YOLO/coco_labels.txt" <<'COCO'
          person
          bicycle
          car
          motorcycle
          airplane
          bus
          train
          truck
          boat
          traffic light
          fire hydrant
          stop sign
          parking meter
          bench
          bird
          cat
          dog
          horse
          sheep
          cow
          elephant
          bear
          zebra
          giraffe
          backpack
          umbrella
          handbag
          tie
          suitcase
          frisbee
          skis
          snowboard
          sports ball
          kite
          baseball bat
          baseball glove
          skateboard
          surfboard
          tennis racket
          bottle
          wine glass
          cup
          fork
          knife
          spoon
          bowl
          banana
          apple
          sandwich
          orange
          broccoli
          carrot
          hot dog
          pizza
          donut
          cake
          chair
          couch
          potted plant
          bed
          dining table
          toilet
          tv
          laptop
          mouse
          remote
          keyboard
          cell phone
          microwave
          oven
          toaster
          sink
          refrigerator
          book
          clock
          vase
          scissors
          teddy bear
          hair drier
          toothbrush
          COCO
          fi

          ls -l "$BGE" "$YOLO"

      - name: Cache the native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-cxx-

      # Guard: pushing from Windows records 100644, and Linux then fails with
      # exit 126 ("not executable"). The mode is fixed in git as well; this keeps
      # a future re-add from silently breaking the build.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish to the lain42 OSS bucket that dl.lain42.top fronts, so a release
      # does not have to squeeze ~1.1 GiB through a home uplink. Manual only: a
      # push should build and test, not silently add a version to the bucket.
      # No-ops (and stays green) until the two secrets exist.
      #
      # The download catalog is regenerated here from the bytes that were just
      # uploaded, so the published sha256 can never describe a file other than
      # the one sitting beside it. It used to be hand-edited on the server, which
      # is exactly how the published hash drifted from the published file.
      #
      # The site-side copy at /var/www/studio/downloads/manifest.json is still a
      # separate file on the radxa and is NOT updated here - see the README's
      # distribution section for the one-line fix.
      - name: Publish APK to OSS
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_ACCESS_KEY_SECRET:-}" ]; then
            echo "OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET are not set; skipping publish."
            echo "Add them under Settings -> Secrets and variables -> Actions to enable this."
            exit 0
          fi

          # arm64 only: the APK the emulator needs is not the APK a phone needs.
          ./gradlew :app:assembleDebug -PdistAbi --console=plain

          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "publishing $VER ($SIZE bytes)"
          echo "sha256: $SHA"

          curl -sSL --fail -o /tmp/ossutil https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64
          chmod +x /tmp/ossutil
          /tmp/ossutil config -e oss-cn-shanghai.aliyuncs.com \
            -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L CH
          /tmp/ossutil cp "$APK" "oss://lain42-downloads/downloads/lyco-jev/$VER/lyco-jev-$VER-arm64-debug.apk" -f
          /tmp/ossutil cp "$APK" "oss://lain42-downloads/downloads/lyco-jev/lyco-jev-android-arm64.apk" -f

          # Read the live catalog first, so the ~18 entries this project does not
          # own are carried through untouched and only lyco-jev is rewritten.
          curl -sSL --fail --retry 3 -o /tmp/manifest.json \
            https://dl.lain42.top/downloads/manifest.json
          python3 tools/update-manifest.py \
            --manifest /tmp/manifest.json \
            --version "$VER" --size "$SIZE" --sha256 "$SHA"
          /tmp/ossutil cp /tmp/manifest.json \
            oss://lain42-downloads/downloads/manifest.json -f

          echo "done: https://dl.lain42.top/downloads/lyco-jev/lyco-jev-android-arm64.apk"

      # ---- on-device (emulator) half of the suite ---------------------------
      # ML Kit OCR, the ONNX detector and the ONNX sentence encoder need nothing
      # beyond the 43 MB assets already fetched, so they run on a stock emulator.
      # LocalJudgeInstrumentedTest is deliberately NOT listed: it needs the
      # 0.53 GB GGUF, which stays out of git. Run it locally after
      #   adb push Jev-Style-0.8B-Decision-v3-Q4_K_M.gguf /data/local/tmp/
      # KVM enablement + action usage copied from ReactiveCircus/
      # android-emulator-runner's own README example.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # NOTE: a "#" inside a YAML folded scalar is literal text, not a comment - it
      # silently swallowed the rest of the Gradle command when this note lived there.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.jev.probe.AutoSendClickInstrumentedTest,com.jev.probe.AppSmokeInstrumentedTest,com.jev.probe.capture.vision.VisionInstrumentedTest,com.jev.probe.core.kb.MemoryInstrumentedTest,com.jev.probe.capture.ocr.OcrInstrumentedTest
            --console=plain

      - name: Upload instrumented test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: '**/build/reports/androidTests/'
          if-no-files-found: warn
